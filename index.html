<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>면접 예상 질문 생성기</title>
<style>
  :root{
    --navy:#1F3864; --navy-deep:#152847; --navy-tint:#E7ECF5;
    --green:#2E7D5B; --green-deep:#1F5C43; --green-tint:#E7F3EC;
    --slate:#3E4C74; --slate-tint:#EAECF5;
    --warn:#993C1D; --warn-tint:#F7E9E3;
    --red:#B3261E; --red-tint:#FBEAE8;
    --ink:#26313F; --ink-soft:#5B6673; --line:#DEE3EA; --bg:#F4F6FA; --paper:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Pretendard","Noto Sans KR","맑은 고딕",sans-serif;}
  .wrap{max-width:820px;margin:0 auto;padding:30px 20px 60px;}

  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;
    letter-spacing:.08em;color:var(--green-deep);background:var(--green-tint);
    padding:5px 12px;border-radius:100px;margin-bottom:14px;}
  h1{font-size:25px;margin:0 0 6px;color:var(--navy-deep);letter-spacing:-.01em;}
  .sub{color:var(--ink-soft);font-size:14px;margin:0 0 24px;line-height:1.55;}

  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;
    padding:22px 22px 24px;margin-bottom:18px;box-shadow:0 1px 2px rgba(31,56,100,.04);}
  .card h2{font-size:13px;font-weight:700;color:var(--navy);margin:0 0 14px;
    display:flex;align-items:center;gap:8px;}
  .card h2 .num{width:20px;height:20px;border-radius:6px;background:var(--navy);color:#fff;
    font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex:none;}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media (max-width:520px){.row2{grid-template-columns:1fr;}}

  label{display:block;font-size:13px;font-weight:600;color:var(--ink);margin:14px 0 6px;}
  label:first-of-type{margin-top:0;}
  label .opt{font-weight:400;color:var(--ink-soft);font-size:12px;}
  input[type=text], textarea{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;
    font-size:14px;font-family:inherit;color:var(--ink);background:#FBFCFE;}
  input[type=text]:focus, textarea:focus{outline:none;border-color:var(--navy);background:#fff;}
  textarea{resize:vertical;}
  textarea#resume{min-height:70px;}

  .qa-pair{border:1px solid var(--line);border-radius:12px;padding:14px 16px;
    margin-bottom:12px;background:#FBFCFE;position:relative;}
  .qa-pair-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .qa-pair-title{font-size:11.5px;font-weight:700;color:var(--green-deep);
    background:var(--green-tint);padding:3px 9px;border-radius:100px;}
  .qa-remove{background:none;border:none;color:var(--ink-soft);font-size:12px;
    cursor:pointer;padding:2px 6px;font-weight:600;}
  .qa-remove:hover{color:var(--red);}
  .qa-pair textarea.answer{min-height:90px;margin-top:8px;}

  .ghost-add{background:var(--navy-tint);color:var(--navy);border:1px dashed #AAB7CE;
    border-radius:10px;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;
    width:100%;margin-top:4px;}
  .ghost-add:hover{background:#DDE4F1;}

  .gen-btn{width:100%;margin-top:18px;background:var(--navy);color:#fff;border:none;
    border-radius:11px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;}
  .gen-btn:hover{background:var(--navy-deep);}

  .error-box{display:none;background:var(--red-tint);border:1px solid var(--red);color:var(--red);
    font-size:13px;padding:11px 13px;border-radius:10px;margin-top:12px;}

  .results-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
  .reshuffle{border:1px solid var(--line);background:#fff;color:var(--navy);
    font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:100px;
    cursor:pointer;display:flex;align-items:center;gap:6px;margin-bottom:14px;}
  .reshuffle:hover{border-color:var(--navy);}

  #results{display:none;}
  .cat{background:var(--paper);border:1px solid var(--line);border-left:4px solid var(--accent,var(--navy));
    border-radius:12px;padding:17px 20px;margin-bottom:14px;}
  .cat-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .cat-dot{width:8px;height:8px;border-radius:50%;background:var(--accent,var(--navy));}
  .cat-name{font-size:14px;font-weight:700;color:var(--ink);}
  .cat ol{margin:0;padding-left:19px;}
  .cat li{font-size:13.5px;line-height:1.65;color:#333A46;margin-bottom:9px;cursor:pointer;
    transition:.12s;padding:3px 6px 3px 2px;border-radius:6px;}
  .cat li:hover{background:var(--green-tint);}
  .cat li.picked{background:var(--green-tint);color:var(--green-deep);font-weight:600;}
  .cat li:last-child{margin-bottom:0;}
  .cat li::marker{color:var(--accent,var(--navy));font-weight:700;}
  .cat li q{font-style:normal;color:var(--navy);font-weight:700;}

  .cat.type-verify{--accent:var(--green);}
  .cat.type-job{--accent:var(--navy);}
  .cat.type-fit{--accent:var(--slate);}
  .cat.type-press{--accent:var(--warn);}

  .pick-hint{font-size:12px;color:var(--ink-soft);margin:-4px 0 16px;}

  .picked-panel{border:1.5px solid var(--green);border-radius:14px;background:var(--green-tint);
    padding:18px 20px;margin-top:6px;}
  .picked-panel h2{color:var(--green-deep);margin:0 0 4px;font-size:13px;font-weight:700;
    display:flex;align-items:center;gap:8px;}
  .picked-panel .count{font-weight:700;}

  .copy-btn{margin-top:14px;width:100%;background:var(--green);color:#fff;border:none;
    border-radius:10px;padding:12px;font-size:14px;font-weight:700;cursor:pointer;}
  .copy-btn:hover{background:var(--green-deep);}
  .copy-msg{font-size:12.5px;color:var(--green-deep);text-align:center;margin-top:8px;min-height:14px;}

    color:var(--navy);background:var(--navy-tint);padding:4px 10px;border-radius:100px;margin-left:8px;}

  footer{text-align:center;color:var(--ink-soft);font-size:11.5px;margin-top:26px;}
</style>
</head>
<body>
<div class="wrap">

  <span class="eyebrow">면접 실습 도구</span>
  <h1>면접 예상 질문 생성기</h1>
  <p class="sub">희망 기업·직무와 자기소개서 문항·답변을 입력하면, 답변 속 문장과 숫자를 근거로 4가지 유형의 예상 면접 질문을 만들어드려요.</p>

  <div class="card">
    <h2><span class="num">1</span>정보 입력</h2>

    <div class="row2">
      <div>
        <label for="company">희망 기업 <span class="opt">(선택)</span></label>

        <input type="text" id="job" placeholder="예: 마케팅, 영업, 인사, 개발자 ...">
      </div>
    </div>

    <label>자기소개서 문항 · 답변 <span class="opt">(최소 1개 필수)</span></label>
    <div id="qaList"></div>
    <button type="button" class="ghost-add" id="addPairBtn">+ 문항 추가</button>

    <button class="gen-btn" id="genBtn">면접 질문 생성하기</button>
    <div class="error-box" id="errorBox"></div>
  </div>

  <div id="results">
    <div class="results-head">
      <button class="reshuffle" id="reshuffleBtn">↻ 다른 조합으로 다시 생성</button>
    </div>
    <div id="catBox"></div>
  </div>

  <div class="card" id="pickCard" style="display:none;">
    <div class="picked-panel">
      <h2>내가 고른 질문 <span class="count" id="pickCount">(0/3)</span></h2>
      <div class="pick-hint">위 목록에서 질문을 클릭하면 여기에 담겨요.</div>
      <ol class="picked-list" id="pickedList"></ol>
      <button class="copy-btn" id="copyBtn">선택한 질문 복사하기</button>
      <div class="copy-msg" id="copyMsg"></div>
    </div>
  </div>

  <footer>㈜에이치알멘토스 · 면접 실습 워크시트 연동용 · 서버·API 키 없이 동작</footer>
</div>

function genericJobBank(job){

    `${job} 직무에서 가장 중요한 역량은 무엇이라고 생각하나요?`,

/* ===================== 자소서 답변 분석 ===================== */

// 답변 텍스트를 문장 단위로 쪼갠 뒤, 정보량이 많아 보이는 문장을 골라낸다.
function extractSnippets(text, n){
  if(!text) return [];
  const sentences = text
    .replace(/\n+/g, " ")
    .split(/(?<=[다요][.!?])\s+|(?<=[.!?])\s+(?=[가-힣A-Z])/)
    .map(s => s.trim())
    .filter(s => s.length >= 8);

  const withNum = sentences.filter(s => /\d/.test(s));
  const withoutNum = sentences
    .filter(s => !/\d/.test(s))
    .sort((a, b) => b.length - a.length);

  const pool = [...withNum, ...withoutNum];
  const uniq = [...new Set(pool)];
  return uniq.slice(0, n);
}

function shorten(s, max){
  max = max || 40;
  if(s.length <= max) return s;
  return s.slice(0, max).trim() + "…";
}

function hasNumber(s){ return /\d/.test(s); }

/* ===================== 문항 UI ===================== */

let pairSeq = 0;
let flatQuestions = [];
let pickedKeys = new Set();

function addPair(q, a){
  pairSeq += 1;
  const id = pairSeq;
  const list = document.getElementById("qaList");
  const div = document.createElement("div");
  div.className = "qa-pair";
  div.id = "pair-" + id;
  div.innerHTML =
    '<div class="qa-pair-head"><span class="qa-pair-title">문항 ' + id + '</span>' +
    '<button type="button" class="qa-remove" data-id="' + id + '">삭제</button></div>' +
    '<input type="text" class="question" placeholder="예: 지원 동기와 입사 후 이루고 싶은 목표를 기술하십시오">' +
    '<textarea class="answer" placeholder="이 문항에 실제로 작성한 답변을 붙여넣으세요."></textarea>';
  list.appendChild(div);
  if(q) div.querySelector(".question").value = q;
  if(a) div.querySelector(".answer").value = a;
  div.querySelector(".qa-remove").addEventListener("click", () => removePair(id));
}

function removePair(id){
  const list = document.getElementById("qaList");
  const el = document.getElementById("pair-" + id);
  if(list.children.length <= 1){
    el.querySelector(".question").value = "";
    el.querySelector(".answer").value = "";
    return;
  }
  el.remove();
}

function collectPairs(){
  const pairs = [];
  document.querySelectorAll(".qa-pair").forEach(el => {
    const q = el.querySelector(".question").value.trim();
    const a = el.querySelector(".answer").value.trim();
    if(a) pairs.push({ q: q || "(문항 미기재)", a });
  });
  return pairs;
}

function escapeHtml(s){
  const div = document.createElement("div");
  div.textContent = String(s);
  return div.innerHTML;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pick(arr, n){ return shuffle(arr).slice(0, Math.min(n, arr.length)); }

/* ===================== 질문 생성 로직 ===================== */

function buildCategories(){
  const company = document.getElementById("company").value.trim();
  const job = document.getElementById("job").value.trim();
  const pairs = collectPairs();

  const allAnswerText = pairs.map(p => p.a).join(" ");
  const snippets = extractSnippets(allAnswerText, 6);
  const verifySnips = pick(snippets, Math.min(3, snippets.length));
  const numSnips = snippets.filter(hasNumber);
  const pressSnips = pick(snippets, Math.min(4, snippets.length));

  // 1) 자소서 검증형
  const verifyQs = [];
  verifySnips.forEach(s => {
    const short = shorten(s, 42);
    const templates = [
      `답변에서 말씀하신 “${short}” 부분, 구체적으로 어떤 과정으로 진행하셨는지 설명해주세요.`,
      `“${short}”라고 하셨는데, 이 경험에서 본인이 맡은 역할과 기여도를 말씀해주세요.`,
      `“${short}” 내용을 뒷받침할 수 있는 구체적인 사례가 있다면 함께 말씀해주세요.`,
    ];
    verifyQs.push(pick(templates, 1)[0]);
  });
  if(verifyQs.length < 3){
    verifyQs.push("해당 경험이 언제, 어떤 상황에서 있었던 일인지 조금 더 구체적으로 설명해주세요.");
  }
  if(verifyQs.length < 3 && pairs.length){
    verifyQs.push(`문항 “${shorten(pairs[0].q, 30)}”에 대한 답변을, 결과 중심으로 다시 한 번 요약해주실 수 있나요?`);
  }

  // 2) 직무역량형
  let jobQs = [];
  const matchedKey = Object.keys(JOB_BANK).find(k => job.includes(k));
  if(job){
    jobQs = pick(matchedKey ? JOB_BANK[matchedKey] : genericJobBank(job), 3);
  } else {
    jobQs = pick([
      "지원 직무를 수행하는 데 있어 본인이 가장 자신 있는 역량은 무엇인가요?",
      "직무와 관련해 부족하다고 느끼는 부분과 이를 보완하기 위한 계획을 말씀해주세요.",
      "이 직무를 선택한 이유를 구체적으로 설명해주세요."
    ], 3);
  }
  if(company){
    jobQs.unshift(`${company}에 지원한 이유와, 다른 기업이 아닌 이 회사여야 하는 이유를 말씀해주세요.`);
  }

  // 3) 인성·조직적합형
  const fitQs = pick(FIT_BANK, 3);

  // 4) 압박·꼬리질문형
  const pressQs = [];
  pressSnips.forEach(s => {
    const short = shorten(s, 40);
    if(hasNumber(s)){
      pressQs.push(`“${short}”에서 언급한 수치는 어떤 기준으로 산출하신 건가요?`);
    } else {
      pressQs.push(`“${short}” 경험에서 본인만의 기여를 팀 전체 성과와 구분해서 설명해주실 수 있나요?`);
    }
  });
  const pressGeneric = [
    "그 경험에서 가장 어려웠던 점은 무엇이었고, 어떻게 극복하셨나요?",
    "비슷한 상황이 다시 온다면 다르게 하실 부분이 있나요?",
    "만약 그 시도가 실패했다면 어떻게 하셨을 것 같나요?",
    "이 경험이 지원 직무와 어떤 연관이 있는지 다시 한 번 명확히 말씀해주세요."
  ];
  while(pressQs.length < 4){
    pressQs.push(pick(pressGeneric, 1)[0]);
  }

  return [
    { name: "자소서 검증형", cls: "type-verify", questions: pick(verifyQs, Math.min(4, verifyQs.length)) },
    { name: "직무역량형", cls: "type-job", questions: pick(jobQs, Math.min(4, jobQs.length)) },
    { name: "인성·조직적합형", cls: "type-fit", questions: fitQs },
    { name: "압박·꼬리질문형", cls: "type-press", questions: pick(pressQs, 4) },
  ];
}

/* ===================== 렌더링 ===================== */

function render(categories){
  const box = document.getElementById("catBox");
  box.innerHTML = "";
  flatQuestions = [];
  pickedKeys = new Set();

  categories.forEach((cat, ci) => {
    const el = document.createElement("div");
    el.className = "cat " + cat.cls;
    const qs = cat.questions.map((q, qi) => {
      const key = ci + "-" + qi;
      flatQuestions.push({ key, text: q });
      return `<li data-key="${key}">${escapeHtml(q)}</li>`;
    }).join("");
    el.innerHTML =
      `<div class="cat-head"><span class="cat-dot"></span><span class="cat-name">${escapeHtml(cat.name)}</span></div><ol>${qs}</ol>`;
    box.appendChild(el);
  });

  box.querySelectorAll("li[data-key]").forEach(li => {
    li.addEventListener("click", () => togglePick(li.dataset.key));
  });

  document.getElementById("results").style.display = "block";
  document.getElementById("pickCard").style.display = "block";
  renderPicked();
}

function togglePick(key){
  if(pickedKeys.has(key)){
    pickedKeys.delete(key);
  } else {
    if(pickedKeys.size >= 3) return;
    pickedKeys.add(key);
  }
  document.querySelectorAll("li[data-key]").forEach(li => {
    li.classList.toggle("picked", pickedKeys.has(li.dataset.key));
  });
  renderPicked();
}

function renderPicked(){
  const countEl = document.getElementById("pickCount");
  const listEl = document.getElementById("pickedList");
  countEl.textContent = `(${pickedKeys.size}/3)`;
  listEl.innerHTML = "";
  flatQuestions.filter(q => pickedKeys.has(q.key)).forEach(q => {
    const li = document.createElement("li");
    li.textContent = q.text;
    listEl.appendChild(li);
  });
  document.getElementById("copyMsg").textContent = "";
}

function showError(msg){
  const box = document.getElementById("errorBox");
  box.textContent = msg;
  box.style.display = "block";
}
function hideError(){
  document.getElementById("errorBox").style.display = "none";
}

function generate(){
  hideError();
  const pairs = collectPairs();
  if(!pairs.length){
    showError("최소 1개 문항에 답변을 입력해주세요.");
    document.getElementById("results").style.display = "none";
    document.getElementById("pickCard").style.display = "none";
    return;
  }
  render(buildCategories());
}

document.getElementById("addPairBtn").addEventListener("click", () => addPair());
document.getElementById("genBtn").addEventListener("click", generate);
document.getElementById("reshuffleBtn").addEventListener("click", generate);
document.getElementById("copyBtn").addEventListener("click", async () => {
  const text = flatQuestions.filter(q => pickedKeys.has(q.key))
    .map((q, i) => `${i+1}. ${q.text}`).join("\n");
  try{
    await navigator.clipboard.writeText(text);
    document.getElementById("copyMsg").textContent = "복사되었어요. 워크시트에 붙여넣어보세요.";
  }catch(e){
    document.getElementById("copyMsg").textContent = text;
  }
});

addPair();
addPair();
</script>
